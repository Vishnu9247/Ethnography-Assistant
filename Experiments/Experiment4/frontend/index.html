<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ethnography Assistant</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">Multi-agent research tool</p>
            <h1>Ethnography Assistant</h1>
          </div>
          <div class="status-pill" id="healthStatus">Checking API</div>
        </header>

        <section class="control-strip" aria-label="Session controls">
          <label for="personaSelect">
            Persona row
            <select id="personaSelect"></select>
          </label>
          <label class="check-control">
            <input id="saveResults" type="checkbox" checked />
            Save results
          </label>
          <label class="check-control">
            <input id="keepMemory" type="checkbox" />
            Keep memory
          </label>
          <button id="runButton" type="button">Run session</button>
        </section>

        <section class="split-layout">
          <article class="panel persona-panel">
            <div class="panel-heading">
              <h2>Persona</h2>
              <span id="personaName"></span>
            </div>
            <dl>
              <dt>Problem</dt>
              <dd id="personaProblem">Loading personas...</dd>
              <dt>Context</dt>
              <dd id="personaDetails"></dd>
              <dt>Reference solution</dt>
              <dd id="personaSolution"></dd>
            </dl>
          </article>

          <article class="panel results-panel">
            <div class="panel-heading">
              <h2>Session Output</h2>
              <span id="runStatus">Idle</span>
            </div>
            <div class="output-grid">
              <section>
                <h3>Final Problem Statement</h3>
                <p id="problemStatement">Run a session to see the agent output.</p>
              </section>
              <section>
                <h3>Patterns</h3>
                <ul id="patternsList"></ul>
              </section>
              <section>
                <h3>Root Causes</h3>
                <ul id="rootCausesList"></ul>
              </section>
              <section>
                <h3>Recommendations</h3>
                <ol id="recommendationsList"></ol>
              </section>
              <section>
                <h3>Saved Files</h3>
                <ul id="filesList"></ul>
              </section>
            </div>
          </article>
        </section>
      </section>
    </main>
    <script src="/assets/app.js"></script>
  </body>
</html>
